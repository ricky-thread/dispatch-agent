<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thread scoring: basePoints vs sliders-only</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #faf9f6; color: #111; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p.sub { color: #666; margin: 0 0 20px; font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 380px) 1fr; gap: 24px; align-items: start; }
    .panel { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; min-width: 0; overflow: hidden; }
    label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
    select, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #ddd; }
    select { display: block; width: 100%; max-width: 100%; }
    button { background: #10b981; color: #fff; border: none; cursor: pointer; margin-top: 12px; }
    button.secondary { background: #fff; color: #333; border: 1px solid #ddd; margin-left: 8px; }
    .prop { display: grid; grid-template-columns: 24px 20px 1fr 52px 36px; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 13px; }
    .drag-handle { cursor: grab; color: #999; user-select: none; text-align: center; line-height: 1; touch-action: none; }
    .drag-handle:active { cursor: grabbing; }
    .prop input[type=range] { width: 100%; cursor: pointer; }
    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .mode h2 { font-size: 14px; margin: 0 0 4px; }
    .mode .formula { font-size: 11px; color: #888; margin-bottom: 12px; }
    .ticket { border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
    .ticket .rank { font-weight: 700; color: #0d9488; }
    .ticket .meta { color: #666; font-size: 12px; margin-top: 4px; }
    .ticket .breakdown { font-size: 11px; color: #888; margin-top: 6px; }
    .scenario-note { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Thread scoring comparator</h1>
  <p class="sub">Side-by-side: position caps + sliders vs sliders only</p>

  <div class="layout">
    <div class="panel">
      <label for="scenario">Scenario</label>
      <select id="scenario"></select>
      <div id="scenarioNote" class="scenario-note"></div>

      <label style="margin-top:16px">Properties (use ⋮⋮ to reorder — affects Mode A only)</label>
      <div id="props"></div>

      <button id="rankBtn">Rank tickets</button>
      <button class="secondary" id="resetBtn">Reset scenario</button>
    </div>

    <div class="results">
      <div class="panel mode">
        <h2>Mode A — Order + sliders (current)</h2>
        <div class="formula">(slider/100) × basePoints[position] × factor</div>
        <div id="modeA"></div>
      </div>
      <div class="panel mode">
        <h2>Mode B — Sliders only</h2>
        <div class="formula">(slider/100) × factor × 100</div>
        <div id="modeB"></div>
      </div>
    </div>
  </div>

<script>
const BASE = [100, 85, 70, 55, 40, 25, 10];

const PROPERTIES = [
  { id: "sla-risk", name: "SLA risk" },
  { id: "priority", name: "Priority" },
  { id: "client-replied", name: "Client replied" },
  { id: "sentiment", name: "Sentiment" },
  { id: "ticket-age", name: "Ticket age" },
  { id: "contact-type", name: "Contact type" },
  { id: "company-type", name: "Company type" },
];

const TICKETS = {
  waiting: {
    label: "A — Client waiting (P3, on-time SLA)",
    factors: { "sla-risk": 0, priority: 0.5, "client-replied": 1, sentiment: 0.45, "ticket-age": 0.45, "contact-type": 0, "company-type": 1 },
    labels: { "client-replied": "Unanswered client reply", priority: "P3 priority" },
  },
  breaching: {
    label: "B — SLA breaching (P2, tech replied)",
    factors: { "sla-risk": 0.85, priority: 0.75, "client-replied": 0.15, sentiment: 0.9, "ticket-age": 0.6, "contact-type": 1, "company-type": 1 },
    labels: { "sla-risk": "SLA breaching", priority: "P2 priority", "client-replied": "Tech replied last" },
  },
  vip: {
    label: "C — VIP, unanswered, P3",
    factors: { "sla-risk": 0.6, priority: 0.5, "client-replied": 1, sentiment: 0.8, "ticket-age": 0.25, "contact-type": 1, "company-type": 1 },
    labels: { "contact-type": "VIP contact", "client-replied": "Unanswered client reply" },
  },
  standard_p1: {
    label: "D — Standard, P1 breaching",
    factors: { "sla-risk": 0.85, priority: 1, "client-replied": 0.15, sentiment: 0.95, "ticket-age": 0.35, "contact-type": 0, "company-type": 1 },
    labels: { "sla-risk": "SLA breaching", priority: "P1 priority" },
  },
  breakfix: {
    label: "E — Break-fix, P2, on time",
    factors: { "sla-risk": 0, priority: 0.75, "client-replied": 0.15, sentiment: 0.45, "ticket-age": 0.45, "contact-type": 1, "company-type": 0 },
    labels: { priority: "P2 priority", "company-type": "Break Fix (no match)" },
  },
  negative_old: {
    label: "F — Negative sentiment, 4h old, P4",
    factors: { "sla-risk": 0, priority: 0.25, "client-replied": 0.15, sentiment: 0.15, "ticket-age": 0.85, "contact-type": 1, "company-type": 1 },
    labels: { "ticket-age": "4h old", sentiment: "Negative sentiment" },
  },
};

const SCENARIOS = {
  default: {
    name: "Default (all 50, default order)",
    note: "Baseline — Mode A preserves SLA > priority hierarchy at half strength.",
    order: PROPERTIES.map(p => p.id),
    sliders: Object.fromEntries(PROPERTIES.map(p => [p.id, 50])),
    tickets: ["waiting", "breaching"],
  },
  responseTime: {
    name: "Response-time MSP (client replied ↑, SLA ↓)",
    note: "Same tickets as scenario 1 — does client-waiting win?",
    order: ["client-replied", "sla-risk", "priority", "sentiment", "ticket-age", "contact-type", "company-type"],
    sliders: { "client-replied": 90, "sla-risk": 30, priority: 50, sentiment: 40, "ticket-age": 40, "contact-type": 50, "company-type": 50 },
    tickets: ["waiting", "breaching"],
  },
  responseTimeReorderOnly: {
    name: "Response-time — reorder only (client replied #1, all 50)",
    note: "Is reorder enough without slider tuning?",
    order: ["client-replied", "sla-risk", "priority", "sentiment", "ticket-age", "contact-type", "company-type"],
    sliders: Object.fromEntries(PROPERTIES.map(p => [p.id, 50])),
    tickets: ["waiting", "breaching"],
  },
  vip: {
    name: "VIP bump (contact type ↑, moved up)",
    note: "VIP ticket vs standard P1 breaching.",
    order: ["sla-risk", "contact-type", "client-replied", "priority", "sentiment", "ticket-age", "company-type"],
    sliders: { "sla-risk": 50, "contact-type": 100, "client-replied": 60, priority: 50, sentiment: 30, "ticket-age": 30, "company-type": 40 },
    tickets: ["vip", "standard_p1"],
  },
  sentimentLow: {
    name: "Low sentiment trust (sentiment ↓)",
    note: "Negative/old ticket vs breaching P1 — sentiment shouldn't dominate.",
    order: PROPERTIES.map(p => p.id),
    sliders: { "sla-risk": 70, priority: 60, "client-replied": 60, sentiment: 15, "ticket-age": 40, "contact-type": 50, "company-type": 50 },
    tickets: ["negative_old", "breaching"],
  },
  managedVsBreakfix: {
    name: "Managed service priority (company type ↑)",
    note: "Break-fix P2 vs managed breaching — commercial priority.",
    order: ["sla-risk", "company-type", "priority", "client-replied", "sentiment", "ticket-age", "contact-type"],
    sliders: { "sla-risk": 50, "company-type": 90, priority: 50, "client-replied": 50, sentiment: 30, "ticket-age": 30, "contact-type": 40 },
    tickets: ["breakfix", "breaching"],
  },
};

let state = { order: [], sliders: {}, enabled: Object.fromEntries(PROPERTIES.map(p => [p.id, true])) };

function scoreTicket(ticket, mode) {
  let total = 0;
  const breakdown = [];
  state.order.forEach((id, index) => {
    if (!state.enabled[id]) return;
    const slider = state.sliders[id] ?? 50;
    const factor = ticket.factors[id] ?? 0;
    const weight = slider / 100;
    const points = mode === "A"
      ? weight * (BASE[index] ?? 0) * factor
      : weight * factor * 100;
    total += points;
    if (points > 0.01) {
      breakdown.push(`${PROPERTIES.find(p => p.id === id).name}: ${points.toFixed(1)}`);
    }
  });
  const maxPossible = state.order.reduce((sum, id, index) => {
    if (!state.enabled[id]) return sum;
    const slider = state.sliders[id] ?? 50;
    return sum + (slider / 100) * (mode === "A" ? (BASE[index] ?? 0) : 100);
  }, 0);
  return {
    total: Math.round(total),
    normalized: maxPossible ? Math.round((total / maxPossible) * 100) : 0,
    breakdown,
  };
}

function rank(mode) {
  const key = document.getElementById("scenario").value;
  const ids = SCENARIOS[key].tickets;
  return ids
    .map(id => ({ id, ticket: TICKETS[id], ...scoreTicket(TICKETS[id], mode) }))
    .sort((a, b) => b.total - a.total);
}

function renderResults() {
  ["A", "B"].forEach(mode => {
    const el = document.getElementById("mode" + mode);
    const ranked = rank(mode);
    el.innerHTML = ranked.map((r, i) => `
      <div class="ticket">
        <div><span class="rank">${i + 1}.</span> <strong>${r.normalized}/100</strong> (${r.total} raw)</div>
        <div class="meta">${r.ticket.label}</div>
        <div class="breakdown">${r.breakdown.join(" · ")}</div>
      </div>`).join("");
  });
}

function renderProps() {
  const el = document.getElementById("props");
  el.innerHTML = state.order.map((id, i) => {
    const p = PROPERTIES.find(x => x.id === id);
    return `<div class="prop" data-id="${id}">
      <span class="drag-handle" draggable="true" title="Drag to reorder" aria-label="Drag to reorder">⋮⋮</span>
      <span>${i + 1}</span>
      <span>${p.name} (cap ${BASE[i]})</span>
      <input type="range" min="0" max="100" value="${state.sliders[id]}" data-id="${id}" class="slider">
      <span>${state.sliders[id]}</span>
    </div>`;
  }).join("");

  el.querySelectorAll(".slider").forEach(inp => {
    inp.oninput = e => {
      state.sliders[e.target.dataset.id] = +e.target.value;
      e.target.nextElementSibling.textContent = e.target.value;
      renderResults();
    };
    inp.addEventListener("mousedown", e => e.stopPropagation());
    inp.addEventListener("pointerdown", e => e.stopPropagation());
  });

  let dragId = null;
  el.querySelectorAll(".prop").forEach(row => {
    const handle = row.querySelector(".drag-handle");
    handle.ondragstart = e => {
      dragId = row.dataset.id;
      e.dataTransfer.effectAllowed = "move";
    };
    handle.ondragend = () => { dragId = null; };
    row.ondragover = e => e.preventDefault();
    row.ondrop = e => {
      e.preventDefault();
      const targetId = row.dataset.id;
      if (!dragId || dragId === targetId) return;
      const from = state.order.indexOf(dragId);
      const to = state.order.indexOf(targetId);
      state.order.splice(from, 1);
      state.order.splice(to, 0, dragId);
      renderProps();
      renderResults();
    };
  });
}

function loadScenario(key) {
  const s = SCENARIOS[key];
  state.order = [...s.order];
  state.sliders = { ...s.sliders };
  document.getElementById("scenarioNote").textContent = s.note;
  renderProps();
  renderResults();
}

const sel = document.getElementById("scenario");
Object.entries(SCENARIOS).forEach(([k, v]) => {
  const o = document.createElement("option");
  o.value = k;
  o.textContent = v.name;
  sel.appendChild(o);
});
sel.onchange = () => loadScenario(sel.value);
document.getElementById("rankBtn").onclick = renderResults;
document.getElementById("resetBtn").onclick = () => loadScenario(sel.value);

loadScenario("default");
</script>
</body>
</html>
